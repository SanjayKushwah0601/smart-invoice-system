[project]
name = "smart-invoice-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mac1", email = "karl karlmarxisty@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
